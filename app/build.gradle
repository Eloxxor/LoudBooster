plugins {
    id 'com.android.application' version '8.10.0'
}

android {
    namespace 'de.loudbooster.app'
    compileSdk 36

    defaultConfig {
        applicationId 'de.loudbooster.app'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
